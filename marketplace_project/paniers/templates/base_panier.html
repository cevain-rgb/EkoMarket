
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EkoMarket - Mon Panier</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800">
    <header class="bg-white shadow-sm py-4">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between gap-4">
                <div class="text-2xl font-bold text-blue-600">EkoMarket</div>
                <div class="flex items-center gap-4">
                    <a href="{% url 'catalogue' %}" class="text-gray-600 hover:text-blue-600">
                        <i class="fas fa-home text-xl"></i>
                    </a>
                    <a href="{% url 'panier' %}" class="text-gray-600 hover:text-blue-600 relative">
                        <i class="fas fa-shopping-cart text-xl"></i>
                        <span id="cartBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">{{ articles_panier|length }}</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="py-8">
    {% block content %}
    {% endblock %}
    </main>
</body>
</html>
{% block tag_js %}
{% endblock %}
