<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AfriMarket - Mon Panier</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800">
    <header class="bg-white shadow-sm py-4">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between gap-4">
                <div class="text-2xl font-bold text-blue-600">AfriMarket</div>
                <div class="flex items-center gap-4">
                    <a href="accueil.html" class="text-gray-600 hover:text-blue-600">
                        <i class="fas fa-home text-xl"></i>
                    </a>
                    <a href="#" class="text-gray-600 hover:text-blue-600 relative">
                        <i class="fas fa-shopping-cart text-xl"></i>
                        <span id="cartBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">3</span>
                    </a>
                    <div class="h-10 w-10 rounded-full overflow-hidden border-2 border-blue-500">
                        <img src="avatar.jpg" alt="Profil" class="h-full w-full object-cover bg-gray-200">
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="py-8">
        <div class="container mx-auto px-4">
            <h2 class="text-2xl font-bold mb-6">Mon Panier</h2>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Liste des produits -->
                <div class="lg:col-span-2 space-y-4" id="cartItems">
                    <!-- Les produits seront ajoutés ici dynamiquement -->
                </div>

                <!-- Résumé de la commande -->
                <div class="lg:col-span-1">
                    <div class="bg-white rounded-lg shadow-sm p-6 sticky top-4">
                        <h3 class="text-xl font-bold mb-4">Résumé</h3>
                        
                        <div class="space-y-3 mb-4">
                            <div class="flex justify-between">
                                <span class="text-gray-600">Sous-total (<span id="itemCount">0</span> articles)</span>
                                <span class="font-medium" id="subtotal">0 FCFA</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-600">Frais de livraison</span>
                                <span class="font-medium" id="shipping">5 000 FCFA</span>
                            </div>
                            <div class="border-t pt-3 flex justify-between text-lg font-bold">
                                <span>Total</span>
                                <span class="text-blue-600" id="total">0 FCFA</span>
                            </div>
                        </div>

                        <button id="checkoutBtn" 
                                class="w-full py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium mb-3">
                            Commander
                        </button>
                        <button onclick="history.back()"
                                class="w-full py-3 border rounded-lg hover:bg-gray-100">
                            Continuer mes achats
                        </button>
                    </div>
                </div>
            </div>

            <!-- Message panier vide -->
            <div id="emptyCart" class="hidden text-center py-12">
                <i class="fas fa-shopping-cart text-6xl text-gray-300 mb-4"></i>
                <h3 class="text-xl font-bold mb-2">Votre panier est vide</h3>
                <p class="text-gray-600 mb-4">Découvrez nos produits et ajoutez-les à votre panier</p>
                <a href="accueil.html" class="inline-block px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    Voir les produits
                </a>
            </div>
        </div>
    </main>

    <!-- Modal de modification -->
    <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold">Modifier le produit</h3>
                <button onclick="closeEditModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <div id="editProductInfo" class="mb-4 p-3 bg-gray-50 rounded-lg">
                <!-- Info produit -->
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium mb-2">Quantité</label>
                <div class="flex items-center justify-center gap-4">
                    <button onclick="decrementQuantity()" 
                            class="w-12 h-12 border-2 rounded-lg hover:bg-gray-100 font-bold text-xl">
                        <i class="fas fa-minus"></i>
                    </button>
                    <input type="number" id="editQuantity" value="1" min="1" 
                           class="w-24 text-center text-xl font-bold px-4 py-3 border-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="incrementQuantity()" 
                            class="w-12 h-12 border-2 rounded-lg hover:bg-gray-100 font-bold text-xl">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            </div>

            <div class="flex gap-3">
                <button onclick="closeEditModal()" 
                        class="flex-1 py-3 border-2 rounded-lg hover:bg-gray-100 font-medium">
                    Annuler
                </button>
                <button onclick="saveEdit()" 
                        class="flex-1 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">
                    Enregistrer
                </button>
            </div>
        </div>
    </div>

    <script>
        // Données du panier (simulation)
        let cartData = [
            {
                id: 1,
                name: 'iPhone 13 Pro Max - 256Go',
                price: 850000,
                quantity: 1,
                image: 'product1.jpg',
                seller: 'TechShop Abidjan',
                location: 'Abidjan, Plateau'
            },
            {
                id: 2,
                name: 'MacBook Pro 14" M1',
                price: 1200000,
                quantity: 1,
                image: 'product2.jpg',
                seller: 'ElectroStore',
                location: 'Abidjan, Cocody'
            },
            {
                id: 3,
                name: 'AirPods Pro 2',
                price: 150000,
                quantity: 2,
                image: 'product3.jpg',
                seller: 'TechShop Abidjan',
                location: 'Abidjan, Plateau'
            }
        ];

        let currentEditId = null;

        // Afficher les produits du panier
        function displayCart() {
            const cartContainer = document.getElementById('cartItems');
            const emptyCart = document.getElementById('emptyCart');
            
            if (cartData.length === 0) {
                cartContainer.classList.add('hidden');
                emptyCart.classList.remove('hidden');
                updateSummary();
                return;
            }

            cartContainer.classList.remove('hidden');
            emptyCart.classList.add('hidden');
            
            cartContainer.innerHTML = cartData.map(item => `
                <div class="bg-white rounded-lg shadow-sm p-4 hover:shadow-md transition-shadow" data-id="${item.id}">
                    <div class="flex flex-col md:flex-row gap-4">
                        <div class="w-full md:w-32 h-32 bg-gray-200 rounded-lg flex items-center justify-center flex-shrink-0">
                            <i class="fas fa-image text-3xl text-gray-400"></i>
                        </div>
                        
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold text-lg mb-2">${item.name}</h4>
                            <p class="text-sm text-gray-600 mb-1">
                                <i class="fas fa-store mr-1"></i>${item.seller}
                            </p>
                            <div class="flex items-center text-sm text-gray-500 mb-3">
                                <i class="fas fa-map-marker-alt mr-1"></i>
                                <span>${item.location}</span>
                            </div>
                            <div class="flex items-center gap-2 mb-2">
                                <span class="text-sm text-gray-600">Quantité:</span>
                                <span class="font-bold text-lg">${item.quantity}</span>
                            </div>
                            <div class="text-xl font-bold text-blue-600 mb-3">
                                ${(item.price * item.quantity).toLocaleString()} FCFA
                            </div>
                            
                            <!-- Boutons d'action TRÈS VISIBLES -->
                            <div class="flex gap-3">
                                <button onclick="editItem(${item.id})" 
                                        class="flex-1 py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium">
                                    <i class="fas fa-edit mr-2"></i>Modifier
                                </button>
                                <button onclick="removeItem(${item.id})" 
                                        class="flex-1 py-2 px-4 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors font-medium">
                                    <i class="fas fa-trash mr-2"></i>Supprimer
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            updateSummary();
        }

        // Mettre à jour le résumé
        function updateSummary() {
            const itemCount = cartData.reduce((sum, item) => sum + item.quantity, 0);
            const subtotal = cartData.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const shipping = cartData.length > 0 ? 5000 : 0;
            const total = subtotal + shipping;

            document.getElementById('itemCount').textContent = itemCount;
            document.getElementById('subtotal').textContent = subtotal.toLocaleString() + ' FCFA';
            document.getElementById('shipping').textContent = shipping.toLocaleString() + ' FCFA';
            document.getElementById('total').textContent = total.toLocaleString() + ' FCFA';
            document.getElementById('cartBadge').textContent = itemCount;
        }

        // Modifier un article
        function editItem(id) {
            currentEditId = id;
            const item = cartData.find(i => i.id === id);
            
            // Afficher les infos du produit dans la modal
            document.getElementById('editProductInfo').innerHTML = `
                <h4 class="font-bold mb-1">${item.name}</h4>
                <p class="text-sm text-gray-600">Prix unitaire: ${item.price.toLocaleString()} FCFA</p>
            `;
            
            document.getElementById('editQuantity').value = item.quantity;
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
            currentEditId = null;
        }

        function incrementQuantity() {
            const input = document.getElementById('editQuantity');
            input.value = parseInt(input.value) + 1;
        }

        function decrementQuantity() {
            const input = document.getElementById('editQuantity');
            if (parseInt(input.value) > 1) {
                input.value = parseInt(input.value) - 1;
            }
        }

        function saveEdit() {
            const newQuantity = parseInt(document.getElementById('editQuantity').value);
            const item = cartData.find(i => i.id === currentEditId);
            if (item) {
                item.quantity = newQuantity;
                displayCart();
                closeEditModal();
                
                // Animation de confirmation
                const toast = document.createElement('div');
                toast.className = 'fixed top-4 right-4 bg-blue-600 text-white px-6 py-3 rounded-lg shadow-lg z-50';
                toast.innerHTML = '<i class="fas fa-check-circle mr-2"></i>Quantité modifiée !';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2000);
            }
        }

        // Supprimer un article
        function removeItem(id) {
            const item = cartData.find(i => i.id === id);
            
            if (confirm(`Voulez-vous vraiment supprimer "${item.name}" du panier ?`)) {
                cartData = cartData.filter(item => item.id !== id);
                displayCart();
                
                // Animation de confirmation
                const toast = document.createElement('div');
                toast.className = 'fixed top-4 right-4 bg-red-600 text-white px-6 py-3 rounded-lg shadow-lg z-50';
                toast.innerHTML = '<i class="fas fa-trash mr-2"></i>Produit supprimé !';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2000);
            }
        }

        // Commander
        document.getElementById('checkoutBtn').addEventListener('click', () => {
            if (cartData.length === 0) {
                alert('Votre panier est vide');
                return;
            }
            alert('Commande validée ! Redirection vers le suivi de commande...');
            setTimeout(() => {
                window.location.href = 'suivi-commande.html';
            }, 1000);
        });

        // Initialisation
        displayCart();
    </script>
</body>
</html>
