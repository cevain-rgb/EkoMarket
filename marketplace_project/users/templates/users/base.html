<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Configuration Tailwind avec thème BLEU -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563EB',      // Bleu principal
                        secondary: '#1D4ED8',    // Bleu secondaire
                        accent: '#3B82F6',       // Bleu accent
                        dark: '#1E293B',         // Gris-bleu foncé
                        light: '#EFF6FF',        // Bleu très clair
                    }
                }
            }
        }
    </script>
    {% block extra_css %}{% endblock %}
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>
        {% block title %}Utilisateur - EkoMarket{% endblock%}
    </title>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    {# Navigation #}
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <h1 class="text-2xl font-bold text-blue-600">
                        EkoMarket
                    </h1>
                </div>
                {% if request.user.is_authenticated %}
                <div>
                    <a href="{% url 'logout' %}" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Se deconnecter</a>
                </div>
                {% endif %}
            </div>
        </div>
    </nav>
    {% block content %}
    {% endblock %}
</body>
</html>
